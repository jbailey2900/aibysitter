name: Aibysitter rules lint
description: Lints AI agent rules files (CLAUDE.md, AGENTS.md, Cursor, Copilot, Gemini, Windsurf) and posts findings as a check run.
author: Jon Bailey
branding:
  icon: check-square
  color: green

inputs:
  files:
    description: Paths or globs, separated by spaces or new lines. Empty finds the supported rules files tracked in the repository.
    required: false
    default: ""
  fail-on-error:
    description: Fail when any Error finding remains.
    required: false
    default: "false"
  fail-below:
    description: Fail when a file's grade is below A, B, C or D.
    required: false
    default: ""
  cli-version:
    description: Aibysitter.Cli version to install from nuget.org. Empty builds the CLI from the action's source.
    required: false
    default: "0.4.2"
  token:
    description: Token for the check run. Needs checks write; without it, annotations go to the log.
    required: false
    default: ${{ github.token }}

outputs:
  grade:
    description: Lowest grade across the files.
    value: ${{ steps.lint.outputs.grade }}
  score:
    description: Lowest score across the files.
    value: ${{ steps.lint.outputs.score }}
  findings:
    description: Total findings across the files.
    value: ${{ steps.lint.outputs.findings }}
  report:
    description: Path to the merged JSON report.
    value: ${{ steps.lint.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Install aibysitter CLI
      if: ${{ inputs.cli-version != '' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: dotnet tool update Aibysitter.Cli --version "$CLI_VERSION" --tool-path "$RUNNER_TEMP/aibysitter-tool"

    - name: Build aibysitter CLI
      if: ${{ inputs.cli-version == '' }}
      shell: bash
      run: dotnet build "$GITHUB_ACTION_PATH/src/Aibysitter.Cli/Aibysitter.Cli.csproj" --configuration Release --output "$RUNNER_TEMP/aibysitter-cli" --nologo --verbosity quiet

    - name: Locate aibysitter CLI
      id: cli
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        temp="$RUNNER_TEMP"
        if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
        if [ -z "$CLI_VERSION" ]; then command="dotnet $temp/aibysitter-cli/Aibysitter.Cli.dll"
        elif [ "$RUNNER_OS" = Windows ]; then command="$temp/aibysitter-tool/aibysitter.exe"
        else command="$temp/aibysitter-tool/aibysitter"
        fi
        echo "command=$command" >> "$GITHUB_OUTPUT"

    - name: Lint rules files
      id: lint
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FAIL_BELOW: ${{ inputs.fail-below }}
        AIBYSITTER_CLI: ${{ steps.cli.outputs.command }}
        AIBYSITTER_OUT: ${{ runner.temp }}/aibysitter
      run: bash "$GITHUB_ACTION_PATH/action/lint.sh"

    - name: Post annotations
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPORT: ${{ steps.lint.outputs.report }}
      run: bash "$GITHUB_ACTION_PATH/action/post.sh"

    - name: Check thresholds
      shell: bash
      env:
        STATUS: ${{ steps.lint.outputs.status }}
      run: |
        case "$STATUS" in
          ok) ;;
          threshold) echo "::error title=aibysitter::A fail-on-error or fail-below threshold failed. See the job summary."; exit 1 ;;
          *) echo "::error title=aibysitter::Linting failed. See the job summary."; exit 1 ;;
        esac

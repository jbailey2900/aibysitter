name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, windows, "${{ vars.RUNNER_LABEL }}"]
    env:
      SITE_PATH: ${{ vars.SITE_PATH }}
      DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
      PREVIOUS_PATH: ${{ vars.PREVIOUS_PATH }}
      HEALTH_URL: https://aibysitting.net/health
      HEALTH_RESOLVE: aibysitting.net:443:127.0.0.1
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check variables
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SITE_PATH)) { throw "Repository variable SITE_PATH is not set." }
          if (-not (Test-Path -LiteralPath $env:SITE_PATH -PathType Container)) { throw "SITE_PATH '$env:SITE_PATH' does not exist." }
          if ([string]::IsNullOrWhiteSpace($env:DB_CONNECTION)) { throw "Repository secret DB_CONNECTION is not set." }
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_PATH)) { throw "Repository variable PREVIOUS_PATH is not set." }
          if (-not (Test-Path -LiteralPath $env:PREVIOUS_PATH -PathType Container)) { throw "PREVIOUS_PATH '$env:PREVIOUS_PATH' does not exist." }
          if ((Resolve-Path -LiteralPath $env:PREVIOUS_PATH).Path.TrimEnd('\') -eq (Resolve-Path -LiteralPath $env:SITE_PATH).Path.TrimEnd('\')) { throw "PREVIOUS_PATH must differ from SITE_PATH." }
          $probe = Join-Path $env:PREVIOUS_PATH ".write-check-$([guid]::NewGuid())"
          try { Set-Content -LiteralPath $probe -Value '' -ErrorAction Stop; Remove-Item -LiteralPath $probe -Force -ErrorAction Stop }
          catch { throw "The runner account cannot write to PREVIOUS_PATH '$env:PREVIOUS_PATH': $($_.Exception.Message)" }
          $sdks = & dotnet --list-sdks 2>$null
          if (-not ($sdks -match '^10\.0\.')) { throw ".NET 10 SDK not found on runner. Installed SDKs: $($sdks -join '; ')" }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Publish
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'aibysitter-publish'
          if (Test-Path -LiteralPath $publish) { Remove-Item -LiteralPath $publish -Recurse -Force }
          dotnet publish src/Aibysitter.Web/Aibysitter.Web.csproj -p:PublishProfile=FolderProfile -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patterns = Join-Path $publish 'wwwroot/js/generated/rules-patterns.mjs'
          if (-not (Test-Path -LiteralPath $patterns -PathType Leaf)) { throw "Publish output is missing $patterns." }

      - name: Build migrations bundle
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP 'aibysitter-efbundle'
          if (Test-Path -LiteralPath $bundleDir) { Remove-Item -LiteralPath $bundleDir -Recurse -Force }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build first so compiler errors appear in the log; dotnet ef only reports "Build failed".
          dotnet build src/Aibysitter.Web/Aibysitter.Web.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet ef migrations bundle --project src/Aibysitter.Web --configuration Release --no-build --verbose --output (Join-Path $bundleDir 'efbundle.exe') --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Refreshed only from a healthy live site.
      - name: Snapshot current site
        id: snapshot
        run: |
          & .github/scripts/deploy-snapshot.ps1 -SitePath $env:SITE_PATH -PreviousPath $env:PREVIOUS_PATH -HealthUrl $env:HEALTH_URL -Resolve $env:HEALTH_RESOLVE
          exit $LASTEXITCODE

      # Before the site goes offline: a failed migration leaves the current site serving. Migrations must be additive.
      - name: Apply database migrations
        run: |
          & (Join-Path $env:RUNNER_TEMP 'aibysitter-efbundle\efbundle.exe') --connection $env:DB_CONNECTION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Take site offline
        run: |
          Set-Content -LiteralPath (Join-Path $env:SITE_PATH 'app_offline.htm') -Encoding utf8 -Value '<!DOCTYPE html><html><head><title>Aibysitter</title></head><body><p>Deploying. Back in a moment.</p></body></html>'
          Start-Sleep -Seconds 5

      - name: Mirror publish output
        id: mirror
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'aibysitter-publish'
          robocopy $publish $env:SITE_PATH /MIR /XF app_offline.htm /XD logs /R:5 /W:2 /NP /NFL /NDL
          $code = $LASTEXITCODE
          Write-Host "robocopy exit code: $code"
          if ($code -ge 8) { exit $code }
          exit 0

      - name: Bring site online
        id: online
        run: |
          $offline = Join-Path $env:SITE_PATH 'app_offline.htm'
          if (Test-Path -LiteralPath $offline) { Remove-Item -LiteralPath $offline -Force }

      - name: Health check
        id: health
        run: |
          & .github/scripts/health-check.ps1 -Url $env:HEALTH_URL -Resolve $env:HEALTH_RESOLVE
          exit $LASTEXITCODE

      # The job stays failed; this restores service only.
      - name: Roll back
        if: >-
          failure() && steps.snapshot.outputs.available == 'true' &&
          (steps.mirror.outcome == 'failure' || steps.online.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          & .github/scripts/deploy-rollback.ps1 -SitePath $env:SITE_PATH -PreviousPath $env:PREVIOUS_PATH -HealthUrl $env:HEALTH_URL -Resolve $env:HEALTH_RESOLVE
          exit $LASTEXITCODE

      - name: Report site left offline
        if: failure()
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SITE_PATH)) { exit 0 }
          $offline = Join-Path $env:SITE_PATH 'app_offline.htm'
          if (Test-Path -LiteralPath $offline) {
            Write-Host "::error title=Site left offline::Deploy failed after app_offline.htm was written. $offline is still in place and the site is serving the offline page. Fix the cause and re-run this workflow."
          }
